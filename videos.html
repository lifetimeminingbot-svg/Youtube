<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videos — ROX HUB</title>
<style>
:root{--p:#8b5cf6;--c:#22d3ee;--t:#e8ecf5;--m:#8a93a8;--g:rgba(255,255,255,.06);--b:rgba(255,255,255,.12)}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#05060a;color:var(--t);padding-bottom:70px}
body.light{background:#f4f6fb;color:#0d1230;--g:rgba(0,0,0,.05);--b:rgba(0,0,0,.1);--m:#5a6478}
a{text-decoration:none;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,#1a1145,transparent 45%),radial-gradient(circle at 80% 0%,#062b3a,transparent 40%),#05060a}
.nav{position:sticky;top:0;backdrop-filter:blur(12px);background:rgba(5,6,10,.75);border-bottom:1px solid var(--b);z-index:9}
.nav-in{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.logo{font-weight:800;display:flex;gap:8px;align-items:center}
.lb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--c));color:#fff;font-weight:900}
.links{display:flex;gap:18px;font-size:14px}
.links a{color:var(--m)}.links a.on,.links a:hover{color:var(--t)}
.btn{display:inline-block;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;border:none;cursor:pointer}
.gh{background:var(--g);border:1px solid var(--b);color:var(--t)}
.container{max-width:1000px;margin:auto;padding:16px}
.g{background:linear-gradient(135deg,#a855f7,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(22px,5vw,32px);margin-bottom:10px}
.card{background:var(--g);border:1px solid var(--b);border-radius:16px;padding:18px;backdrop-filter:blur(12px);transition:.2s}
.card:hover{transform:translateY(-3px)}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}
.thumb{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#1a1145,#062b3a);display:grid;place-items:center;font-size:30px}
.vc h3{font-size:15px;margin:10px 0 4px}.vc p{font-size:12px;color:var(--m)}
input{width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--b);background:var(--g);color:var(--t);outline:none;margin:14px 0}
footer{padding:26px 0 80px;text-align:center;color:var(--m);font-size:13px;border-top:1px solid var(--b);margin-top:30px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,6,10,.9);border-top:1px solid var(--b);display:none;padding:10px 0}
.bnav a{flex:1;text-align:center;font-size:11px;color:var(--m)}.bnav a.on{color:var(--c)}
@media(max-width:820px){.links{display:none}.g3{grid-template-columns:1fr 1fr}.bnav{display:flex}}
@media(max-width:520px){.g3{grid-template-columns:1fr}}
</style>
</head><body>
<div class="bg"></div>

<nav class="nav"><div class="nav-in">
  <a class="logo" href="index.html"><span class="lb">R</span>ROX <span style="color:var(--c)">HUB</span></a>
  <div class="links">
    <a href="index.html">Home</a><a href="videos.html" class="on">Videos</a>
    <a href="shorts.html">Shorts</a><a href="about.html">About</a><a href="contact.html">Contact</a>
  </div>
  <button class="btn gh" id="theme">🌙</button>
</div></nav>

<div class="container">
  <h1>All <span class="g">Videos</span></h1>
  <input id="search" placeholder="🔍 Search videos...">
  <div class="grid g3" id="grid"></div>
</div>

<footer>© 2026 ROX CREATOR HUB</footer>
<nav class="bnav">
  <a href="index.html">🏠 Home</a><a href="videos.html" class="on">▶ Videos</a>
  <a href="shorts.html">⚡ Shorts</a><a href="dashboard.html">📊 Dash</a>
</nav>

<script>
var tb=document.getElementById('theme');
if(localStorage.getItem('roxT')==='l'){document.body.classList.add('light');tb.textContent='☀️'}
tb.onclick=function(){document.body.classList.toggle('light');var l=document.body.classList.contains('light');localStorage.setItem('roxT',l?'l':'d');tb.textContent=l?'☀️':'🌙'};

var V=[
  {t:'Tech Tips #1 — ফোন ফাস্ট করার ৫টি উপায়',c:'Tips'},
  {t:'Tech Tips #2 — ফ্রি অ্যাপ সেটআপ',c:'Apps'},
  {t:'Tech Tips #3 — ব্যাটারি বাঁচানোর ট্রিকস',c:'Tips'},
  {t:'Top 5 Free Apps for Android',c:'Apps'},
  {t:'How to Speed Up Your Phone',c:'Tips'},
  {t:'Best Budget Gadgets 2026',c:'Reviews'}
];
function draw(a){
  document.getElementById('grid').innerHTML=a.map(function(v){
    return '<div class="card vc"><div class="thumb">▶</div><h3>'+v.t+'</h3><p>'+v.c+'</p></div>'
  }).join('');
}
draw(V);
document.getElementById('search').oninput=function(){
  var q=this.value.toLowerCase();
  draw(V.filter(function(v){return v.t.toLowerCase().indexOf(q)>-1}));
};
</script>
</body></html>

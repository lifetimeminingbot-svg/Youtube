<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — ROX HUB</title>
<style>
  :root{--p:#8b5cf6;--c:#22d3ee;--t:#e8ecf5;--m:#8a93a8;--g:rgba(255,255,255,.06);--b:rgba(255,255,255,.12)}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
  body{background:#05060a;color:var(--t);padding-bottom:70px}
  body.light{background:#f4f6fb;color:#0d1230;--g:rgba(0,0,0,.05);--b:rgba(0,0,0,.1);--m:#5a6478}
  a{text-decoration:none;color:inherit}
  .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,#1a1145,transparent 45%),radial-gradient(circle at 80% 0%,#062b3a,transparent 40%),#05060a}
  
  /* Navbar */
  .nav{position:sticky;top:0;backdrop-filter:blur(12px);background:rgba(5,6,10,.75);border-bottom:1px solid var(--b);z-index:9}
  .nav-in{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
  .logo{font-weight:800;display:flex;gap:8px;align-items:center}
  .lb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--c));color:#fff;font-weight:900}
  .links{display:flex;gap:18px;font-size:14px}
  .links a{color:var(--m)}.links a.on,.links a:hover{color:var(--t)}
  .btn{display:inline-block;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;border:none;cursor:pointer}
  .b1{background:linear-gradient(135deg,var(--p),#a855f7);color:#fff}
  .gh{background:var(--g);border:1px solid var(--b);color:var(--t)}
  
  /* Layout */
  .container{max-width:1000px;margin:auto;padding:16px}
  .g{background:linear-gradient(135deg,#a855f7,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:clamp(22px,5vw,32px);margin-bottom:10px}
  .card{background:var(--g);border:1px solid var(--b);border-radius:16px;padding:18px;backdrop-filter:blur(12px)}
  .grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}
  input{width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--b);background:var(--g);color:var(--t);outline:none;font-size:14px;margin-bottom:10px}
  
  /* Footer & Bottom Nav */
  footer{padding:26px 0 80px;text-align:center;color:var(--m);font-size:13px;border-top:1px solid var(--b);margin-top:30px}
  .bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,6,10,.9);border-top:1px solid var(--b);display:none;padding:10px 0}
  .bnav a{flex:1;text-align:center;font-size:11px;color:var(--m)}.bnav a.on{color:var(--c)}
  
  @media(max-width:820px){.links{display:none}.g3{grid-template-columns:1fr}.bnav{display:flex}}
</style>
</head>
<body>
<div class="bg"></div>

<!-- Navbar -->
<nav class="nav">
  <div class="nav-in">
    <a class="logo" href="index.html"><span class="lb">R</span>ROX <span style="color:var(--c)">HUB</span></a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a href="shorts.html">Shorts</a>
      <a href="dashboard.html" class="on">Dashboard</a>
    </div>
    <button class="btn gh" id="theme">🌙</button>
  </div>
</nav>

<div class="container">

  <!-- LOGIN VIEW -->
  <div id="loginView" class="card" style="max-width:400px;margin:auto">
    <h2 style="margin-bottom:8px">Admin Login</h2>
    <p style="color:var(--m);font-size:13px;margin-bottom:14px">Private creator dashboard</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="pass" type="password" placeholder="Password" required>
      <button class="btn b1" type="submit" style="width:100%">Login</button>
      <p id="loginMsg" style="color:#ff6b6b;font-size:13px;margin-top:10px"></p>
    </form>
  </div>

  <!-- DASHBOARD VIEW (লগইন করলেই দেখা যাবে) -->
  <div id="dashView" style="display:none">
    <h1>Creator <span class="g">Dashboard</span></h1>
    <p style="color:var(--m);font-size:13px;margin-bottom:18px">Protected by Firebase Auth</p>

    <div class="grid g3">
      <div class="card">
        <h3>🔗 YouTube Link</h3>
        <input id="setYt" placeholder="https://youtube.com/@...">
        <button class="btn gh" onclick="saveLinks()">Save</button>
      </div>
      <div class="card">
        <h3>🔗 Facebook Link</h3>
        <input id="setFb" placeholder="https://facebook.com/...">
        <button class="btn gh" onclick="saveLinks()">Save</button>
      </div>
      <div class="card">
        <h3>📊 Visitors</h3>
        <p style="color:var(--m);font-size:13px">Tracking ready (Firestore)</p>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3>➕ Add Video</h3>
      <input id="vTitle" placeholder="Video title">
      <input id="vCat" placeholder="Category">
      <input id="vUrl" placeholder="YouTube URL">
      <button class="btn b1" onclick="addVideo()">Add Video</button>
      <p id="addMsg" style="color:var(--c);font-size:13px;margin-top:10px"></p>
    </div>

    <div style="text-align:right;margin-top:16px">
      <button class="btn gh" onclick="logout()">Logout</button>
    </div>
  </div>

</div>

<footer>© 2026 ROX CREATOR HUB</footer>
<nav class="bnav">
  <a href="index.html">🏠 Home</a>
  <a href="videos.html">▶ Videos</a>
  <a href="shorts.html">⚡ Shorts</a>
  <a href="dashboard.html" class="on">📊 Dash</a>
</nav>

<!-- ================= FIREBASE SCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// আপনার Firebase Config
const cfg = {
  apiKey: "AIzaSyCOIX8EfRw5AuILjcXez2d0XItlGckvsq4",
  authDomain: "life-time-mining.firebaseapp.com",
  projectId: "life-time-mining",
  storageBucket: "life-time-mining.firebasestorage.app",
  messagingSenderId: "1075967106343",
  appId: "1:1075967106343:web:eac1f24ed6e989955fdd02",
  measurementId: "G-JLZN2J7E0K"
};

const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);

const loginView = document.getElementById('loginView');
const dashView = document.getElementById('dashView');

// ১. অথেনটিকেশন স্টেট চেক (লগইন আছে কি না)
onAuthStateChanged(auth, user => {
  if (user) { 
    loginView.style.display = 'none'; 
    dashView.style.display = 'block'; 
    loadSettings(); 
  } else { 
    loginView.style.display = 'block'; 
    dashView.style.display = 'none'; 
  }
});

// ২. লগইন ফর্ম সাবমিট
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('loginMsg');
  msg.textContent = 'অপেক্ষা করুন...';
  msg.style.color = 'var(--c)';
  try {
    await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
    msg.textContent = '';
  } catch (err) { 
    msg.style.color = '#ff6b6b';
    msg.textContent = 'লগইন ব্যর্থ: ' + err.message; 
  }
};

// ৩. সেটিংস লোড করা (লিংক)
async function loadSettings() {
  try {
    const s = await getDoc(doc(db, 'settings', 'main'));
    if (s.exists()) {
      document.getElementById('setYt').value = s.data().youtube || '';
      document.getElementById('setFb').value = s.data().facebook || '';
    }
  } catch(e) { console.log("Error loading settings", e); }
}

// ৪. লিংক সেভ করা
window.saveLinks = async () => {
  try {
    await setDoc(doc(db,'settings','main'), {
      youtube: document.getElementById('setYt').value.trim(),
      facebook: document.getElementById('setFb').value.trim()
    }, { merge: true });
    alert('লিংক সেভ হয়েছে ✅');
  } catch(e) { alert('সেভ করা যায়নি: ' + e.message); }
};

// ৫. নতুন ভিডিও অ্যাড করা
window.addVideo = async () => {
  const t = document.getElementById('vTitle').value.trim();
  const c = document.getElementById('vCat').value.trim();
  const u = document.getElementById('vUrl').value.trim();
  const m = document.getElementById('addMsg');
  
  if (!t || !c) { 
    m.textContent = 'Title ও Category দিন ❌'; 
    m.style.color = '#ff6b6b';
    return; 
  }
  
  try {
    await addDoc(collection(db,'videos'), { title:t, category:c, url:u, createdAt: serverTimestamp() });
    m.style.color = 'var(--c)';
    m.textContent = 'ভিডিও যোগ হয়েছে ✅';
    document.getElementById('vTitle').value = '';
    document.getElementById('vCat').value = '';
    document.getElementById('vUrl').value = '';
  } catch (e) { 
    m.style.color = '#ff6b6b';
    m.textContent = 'সমস্যা: ' + e.message; 
  }
};

// ৬. লগআউট
window.logout = () => signOut(auth);
</script>

<!-- ================= THEME SCRIPT ================= -->
<script>
var tb=document.getElementById('theme');
if(localStorage.getItem('roxT')==='l'){document.body.classList.add('light');tb.textContent='☀️'}
tb.onclick=function(){
  document.body.classList.toggle('light');
  var l=document.body.classList.contains('light');
  localStorage.setItem('roxT',l?'l':'d');
  tb.textContent=l?'☀️':'🌙'
};
</script>
</body>
</html>

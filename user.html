<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>User Dashboard — ROX HUB</title>
<style>
  :root{--p:#8b5cf6;--c:#22d3ee;--t:#e8ecf5;--m:#8a93a8;--g:rgba(255,255,255,.06);--b:rgba(255,255,255,.12)}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
  body{background:#05060a;color:var(--t);padding-bottom:70px}
  .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,#1a1145,transparent 45%),radial-gradient(circle at 80% 0%,#062b3a,transparent 40%),#05060a}
  .container{max-width:600px;margin:auto;padding:16px}
  .card{background:var(--g);border:1px solid var(--b);border-radius:16px;padding:20px;backdrop-filter:blur(12px);margin-bottom:14px}
  h2,h3{margin-bottom:10px}
  .g{background:linear-gradient(135deg,#a855f7,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
  input,select{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--b);background:var(--g);color:var(--t);outline:none;font-size:14px;margin-bottom:10px}
  .btn{display:inline-block;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;border:none;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#a855f7);color:#fff;width:100%;margin-top:5px}
  .btn-out{background:transparent;border:1px solid var(--b);color:var(--t)}
  .point-box{text-align:center;padding:20px;background:rgba(139,92,246,.1);border-radius:14px;margin-bottom:15px}
  .point-box h1{font-size:40px;font-weight:900;color:var(--c)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  
  <!-- LOGIN & REGISTER -->
  <div id="authView" class="card">
    <h2>Join <span class="g">ROX HUB</span></h2>
    <p style="color:var(--m);font-size:13px;margin-bottom:15px">ভিডিও দেখুন, কোড দিন, পয়েন্ট নিন</p>
    <form id="authForm">
      <input id="uName" placeholder="আপনার নাম" required>
      <input id="uEmail" type="email" placeholder="ইমেইল" required>
      <input id="uPass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" required minlength="6">
      <button class="btn" type="submit" id="authBtn">রেজিস্টার করুন</button>
      <p style="text-align:center;margin-top:10px;font-size:13px;color:var(--m)">
        অ্যাকাউন্ট আছে? <a href="#" onclick="toggleAuth()" style="color:var(--c)">লগইন করুন</a>
      </p>
      <p id="authMsg" style="color:#ff6b6b;font-size:13px;margin-top:10px;text-align:center"></p>
    </form>
  </div>

  <!-- USER DASHBOARD -->
  <div id="userView" style="display:none">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><h3>স্বাগতম, <span id="dispName">User</span></h3><p style="color:var(--m);font-size:13px" id="dispEmail"></p></div>
      <button class="btn btn-out" style="width:auto" onclick="logout()">Logout</button>
    </div>

    <div class="card point-box">
      <p style="color:var(--m);font-size:13px">আপনার বর্তমান পয়েন্ট</p>
      <h1 id="userPoints">0</h1>
    </div>

    <div class="card">
      <h3>🔑 ভিডিও কোড সাবমিট</h3>
      <input id="codeInput" placeholder="ভিডিওতে দেখা কোডটি লিখুন">
      <button class="btn" onclick="submitCode()">সাবমিট করুন</button>
      <p id="codeMsg" style="font-size:13px;margin-top:10px;text-align:center"></p>
    </div>

    <div class="card">
      <h3>💸 টাকা তুলুন</h3>
      <select id="wMethod"><option>Bkash</option><option>Nagad</option></select>
      <input id="wNumber" placeholder="বিকাশ/নগদ নাম্বার">
      <input id="wAmount" type="number" placeholder="কত পয়েন্ট তুলতে চান? (কমপক্ষে ১০০০)">
      <button class="btn" onclick="requestWithdraw()">রিকোয়েস্ট পাঠান</button>
      <p id="wMsg" style="font-size:13px;margin-top:10px;text-align:center"></p>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, getDocs, serverTimestamp, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg = { apiKey: "AIzaSyCOIX8EfRw5AuILjcXez2d0XItlGckvsq4", authDomain: "life-time-mining.firebaseapp.com", projectId: "life-time-mining", storageBucket: "life-time-mining.firebasestorage.app", messagingSenderId: "1075967106343", appId: "1:1075967106343:web:eac1f24ed6e989955fdd02" };
const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);

let isRegister = true;
window.toggleAuth = () => {
  isRegister = !isRegister;
  document.getElementById('authBtn').textContent = isRegister ? 'রেজিস্টার করুন' : 'লগইন করুন';
  document.getElementById('uName').style.display = isRegister ? 'block' : 'none';
};

// অ্যাকাউন্ট তৈরি বা লগইন
document.getElementById('authForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('uEmail').value;
  const pass = document.getElementById('uPass').value;
  const name = document.getElementById('uName').value;
  const msg = document.getElementById('authMsg');
  msg.style.color = '#22d3ee';
  msg.textContent = 'অপেক্ষা করুন...';

  try {
    if (isRegister) {
      const res = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, "users", res.user.uid), { name, email, points: 0, createdAt: serverTimestamp() });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) { msg.style.color = '#ff6b6b'; msg.textContent = err.message; }
};

// ইউজার স্টেট চেক
onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('userView').style.display = 'block';
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      const d = snap.data();
      document.getElementById('dispName').textContent = d.name;
      document.getElementById('dispEmail').textContent = d.email;
      document.getElementById('userPoints').textContent = d.points || 0;
    }
  } else {
    document.getElementById('authView').style.display = 'block';
    document.getElementById('userView').style.display = 'none';
  }
});

// কোড সাবমিট করা
window.submitCode = async () => {
  const code = document.getElementById('codeInput').value.trim();
  const msg = document.getElementById('codeMsg');
  const user = auth.currentUser;
  if (!code) return;

  msg.textContent = 'চেক করা হচ্ছে...'; msg.style.color = 'var(--c)';
  try {
    const q = query(collection(db, "videos"), where("secretCode", "==", code));
    const snap = await getDocs(q);
    
    if (snap.empty) { msg.style.color = '#ff6b6b'; msg.textContent = 'ভুল কোড! ❌'; return; }
    
    const video = snap.docs[0].data();
    const uRef = doc(db, "users", user.uid);
    const uSnap = await getDoc(uRef);
    const currentPoints = uSnap.data().points || 0;
    
    await updateDoc(uRef, { points: currentPoints + video.rewardPoints });
    document.getElementById('userPoints').textContent = currentPoints + video.rewardPoints;
    msg.style.color = '#10b981'; msg.textContent = `সফল! ${video.rewardPoints} পয়েন্ট যোগ হয়েছে ✅`;
    document.getElementById('codeInput').value = '';
  } catch (e) { msg.style.color = '#ff6b6b'; msg.textContent = 'সমস্যা: ' + e.message; }
};

// উইথড্র রিকোয়েস্ট
window.requestWithdraw = async () => {
  const method = document.getElementById('wMethod').value;
  const number = document.getElementById('wNumber').value.trim();
  const amount = parseInt(document.getElementById('wAmount').value);
  const msg = document.getElementById('wMsg');
  const user = auth.currentUser;

  if (!number || !amount) { msg.style.color = '#ff6b6b'; msg.textContent = 'সব ঘর পূরণ করুন!'; return; }
  if (amount < 1000) { msg.style.color = '#ff6b6b'; msg.textContent = 'কমপক্ষে ১০০০ পয়েন্ট লাগবে!'; return; }

  const uSnap = await getDoc(doc(db, "users", user.uid));
  if (uSnap.data().points < amount) { msg.style.color = '#ff6b6b'; msg.textContent = 'পর্যাপ্ত পয়েন্ট নেই!'; return; }

  try {
    await updateDoc(doc(db, "users", user.uid), { points: uSnap.data().points - amount });
    await addDoc(collection(db, "withdrawals"), { userId: user.uid, userEmail: user.email, method, number, amount, status: "pending", createdAt: serverTimestamp() });
    document.getElementById('userPoints').textContent = uSnap.data().points - amount;
    msg.style.color = '#10b981'; msg.textContent = 'রিকোয়েস্ট পাঠানো হয়েছে! অ্যাডমিন চেক করে পাঠাবে ✅';
    document.getElementById('wNumber').value = ''; document.getElementById('wAmount').value = '';
  } catch (e) { msg.style.color = '#ff6b6b'; msg.textContent = 'সমস্যা: ' + e.message; }
};

window.logout = () => signOut(auth);
</script>
</body>
</html>
